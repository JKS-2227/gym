<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Gym Log Master</title>
    <style>
        :root {
            --bg-color: #121212; --card-bg: #1e1e1e; --text-color: #ffffff;
            --text-secondary: #aaaaaa; --accent-color: #0a84ff; --border-color: #333333;
            --input-bg: #2c2c2e; --danger-color: #ff453a;
        }
        @media (prefers-color-scheme: light) {
            :root {
                --bg-color: #f2f2f7; --card-bg: #ffffff; --text-color: #000000;
                --text-secondary: #666666; --accent-color: #007aff; --border-color: #e5e5ea;
                --input-bg: #e9e9eb; --danger-color: #ff3b30;
            }
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-color); color: var(--text-color);
            margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center;
            padding-top: calc(20px + env(safe-area-inset-top));
        }
        .container { width: 100%; max-width: 450px; }
        h1 { font-size: 24px; margin-bottom: 15px; font-weight: 700; text-align: center; }
        .card {
            background-color: var(--card-bg); border-radius: 12px; padding: 16px;
            margin-bottom: 16px; box-shadow: 0 4px 6px rgba(0,0,0,.05); border: 1px solid var(--border-color);
        }
        h2 { font-size: 18px; margin-top: 0; margin-bottom: 14px; color: var(--accent-color); border-bottom: 1px solid var(--border-color); padding-bottom: 6px; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
        .form-group { display: flex; flex-direction: column; margin-bottom: 10px; }
        label { font-size: 11px; font-weight: 600; text-transform: uppercase; color: var(--text-secondary); margin-bottom: 4px; }
        input, select { background-color: var(--input-bg); border: none; border-radius: 8px; padding: 10px; color: var(--text-color); font-size: 16px; -webkit-appearance: none; }
        input:focus, select:focus { outline: 2px solid var(--accent-color); }
        .btn-primary { background-color: var(--accent-color); color: #fff; border: none; border-radius: 8px; padding: 14px; font-size: 16px; font-weight: 600; width: 100%; margin-top: 10px; cursor: pointer; }
        .btn-secondary { background-color: transparent; color: var(--text-secondary); border: 1px solid var(--border-color); border-radius: 8px; padding: 10px; font-size: 14px; width: 100%; margin-top: 8px; cursor: pointer; }
        .log-entry { border-left: 3px solid var(--accent-color); padding-left: 10px; margin-bottom: 16px; font-size: 14px; position: relative; }
        .log-entry span { color: var(--text-secondary); display: block; font-size: 11px; }
        .delete-btn { position: absolute; right: 0; top: 0; background: none; border: none; color: var(--danger-color); font-size: 12px; cursor: pointer; }
        .tabs { display: flex; gap: 8px; margin-bottom: 15px; }
        .tab { flex: 1; padding: 10px; text-align: center; background-color: var(--input-bg); border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; border: 1px solid transparent; }
        .tab.active { background-color: var(--accent-color); color: white; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Gym Tracker Master</h1>
        
        <div class="card">
            <div class="form-group" style="margin-bottom:0;">
                <label>Workout Date</label>
                <input type="date" id="workoutDate">
            </div>
        </div>

        <div class="tabs">
            <div class="tab active" onclick="switchTab('rowing-tab')">🚣 Rowing</div>
            <div class="tab" onclick="switchTab('lifting-tab')">💪 Lifting</div>
        </div>

        <!-- ROWING FORM -->
        <div id="rowing-tab" class="tab-content active">
            <div class="card">
                <h2>Rowing Session</h2>
                <div class="grid-2">
                    <div class="form-group">
                        <label>Kcal</label>
                        <input type="number" inputmode="numeric" id="kcal" placeholder="0">
                    </div>
                    <div class="form-group">
                        <label>Resistance</label>
                        <input type="number" inputmode="numeric" id="res" value="10">
                    </div>
                </div>
                <div class="grid-2">
                    <div class="form-group">
                        <label>Watts (Avg)</label>
                        <input type="number" inputmode="numeric" id="wAvg" placeholder="0" oninput="calculateSplit('wAvg', 'mAvg')">
                    </div>
                    <div class="form-group">
                        <label>Watts (Max)</label>
                        <input type="number" inputmode="numeric" id="wMax" placeholder="0" oninput="calculateSplit('wMax', 'mMax')">
                    </div>
                </div>
                <div class="grid-2">
                    <div class="form-group">
                        <label>SPM (Avg)</label>
                        <input type="number" inputmode="numeric" id="spmAvg" placeholder="0">
                    </div>
                    <div class="form-group">
                        <label>SPM (Max)</label>
                        <input type="number" inputmode="numeric" id="spmMax" placeholder="0">
                    </div>
                </div>
                <div class="grid-2">
                    <div class="form-group">
                        <label>500m (Avg)</label>
                        <input type="text" id="mAvg" placeholder="0:00.0">
                    </div>
                    <div class="form-group">
                        <label>500m (Max)</label>
                        <input type="text" id="mMax" placeholder="0:00.0">
                    </div>
                </div>
                <div class="grid-2">
                    <div class="form-group">
                        <label>Drive Length (Avg)</label>
                        <input type="number" inputmode="decimal" step="0.01" id="dlAvg" placeholder="0.00">
                    </div>
                    <div class="form-group">
                        <label>Drive Length (Max)</label>
                        <input type="number" inputmode="decimal" step="0.01" id="dlMax" placeholder="0.00">
                    </div>
                </div>
                <button type="button" class="btn-primary" onclick="saveRowing()">Save Rowing Session</button>
            </div>
        </div>

        <!-- LIFTING FORM (WITH SMART DATALIST) -->
        <div id="lifting-tab" class="tab-content">
            <div class="card">
                <h2>Strength Training</h2>
                <div class="form-group">
                    <label>Muscle Group</label>
                    <select id="muscleGroup">
                        <option value="Chest">Chest</option>
                        <option value="Back">Back</option>
                        <option value="Shoulders">Shoulders</option>
                        <option value="Legs">Legs</option>
                        <option value="Arms">Arms</option>
                        <option value="Core">Core/Abs</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Exercise Name (Type or Select)</label>
                    <input type="text" id="exerciseName" list="exerciseOptions" placeholder="e.g., Bench Press">
                    <datalist id="exerciseOptions">
                        <!-- Preloaded standard options -->
                        <option value="Bench Press"></option>
                        <option value="Incline Dumbbell Press"></option>
                        <option value="Squats"></option>
                        <option value="Deadlifts"></option>
                        <option value="Overhead Press"></option>
                        <option value="Barbell Rows"></option>
                        <option value="Lat Pulldown"></option>
                        <option value="Bicep Curls"></option>
                        <option value="Tricep Pushdowns"></option>
                        <option value="Plank"></option>
                    </datalist>
                </div>
                <div class="grid-2">
                    <div class="form-group">
                        <label>Weight (lbs/kg)</label>
                        <input type="number" inputmode="numeric" id="liftWeight" placeholder="0">
                    </div>
                    <div class="form-group">
                        <label>Reps</label>
                        <input type="number" inputmode="numeric" id="liftReps" placeholder="0">
                    </div>
                </div>
                <button type="button" class="btn-primary" onclick="saveLifting()">Save Lifting Set</button>
            </div>
        </div>

        <div class="card">
            <h2>Workout History Log</h2>
            <div id="history">No history saved yet.</div>
            <button type="button" class="btn-secondary" style="margin-top:15px;" onclick="exportToCSV()">Export History Backup (CSV)</button>
        </div>
    </div>

    <script>


        // Load custom user exercise history into datalist on launch
        function loadCustomExercises() {
            const savedEx = JSON.parse(localStorage.getItem('customExercises')) || [];
            const dl = document.getElementById('exerciseOptions');
            savedEx.forEach(ex => {
                // Prevent duplicate options from rendering
                if (!Array.from(dl.options).some(opt => opt.value.toLowerCase() === ex.toLowerCase())) {
                    const opt = document.createElement('option');
                    opt.value = ex;
                    dl.appendChild(opt);
                }
            });
        }

        function switchTab(tabId) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            event.currentTarget.classList.add('active');
            document.getElementById(tabId).classList.add('active');
        }

        function calculateSplit(wattsId, splitId) {
            const watts = parseFloat(document.getElementById(wattsId).value);
            const splitInput = document.getElementById(splitId);
            if (!watts || watts <= 0) { splitInput.value = ''; return; }
            const totalSeconds = Math.pow(2.80 / watts, 1/3) * 500;
            const minutes = Math.floor(totalSeconds / 60);
            const seconds = (totalSeconds % 60).toFixed(1);
            splitInput.value = `${minutes}:${seconds.padStart(4, '0')}`;
        }

        function getSelectedDate() {
            const dInput = document.getElementById('workoutDate').value;
            if(!dInput) return new Date().toLocaleDateString();
            const parts = dInput.split('-');
            return `${parts[1]}/${parts[2]}/${parts[0]}`; 
        }

        function saveRowing() {
            const data = {
                id: Date.now(), type: 'Rowing', date: getSelectedDate(),
                kcal: document.getElementById('kcal').value || 0, res: document.getElementById('res').value || 10,
                wAvg: document.getElementById('wAvg').value || 0, wMax: document.getElementById('wMax').value || 0,
                spmAvg: document.getElementById('spmAvg').value || 0, spmMax: document.getElementById('spmMax').value || 0,
                mAvg: document.getElementById('mAvg').value || '0:00.0', mMax: document.getElementById('mMax').value || '0:00.0',
                dlAvg: document.getElementById('dlAvg').value || '0.00', dlMax: document.getElementById('dlMax').value || '0.00'
            };
            let log = JSON.parse(localStorage.getItem('gymMasterHistory')) || [];
            log.unshift(data);
            localStorage.setItem('gymMasterHistory', JSON.stringify(log));
            displayHistory();
            
            const currentRes = document.getElementById('res').value;
            document.getElementById('kcal').value = ''; document.getElementById('wAvg').value = '';
            document.getElementById('wMax').value = ''; document.getElementById('spmAvg').value = '';
            document.getElementById('spmMax').value = ''; document.getElementById('mAvg').value = '';
            document.getElementById('mMax').value = ''; document.getElementById('dlAvg').value = '';
            document.getElementById('dlMax').value = ''; document.getElementById('res').value = currentRes;
            alert('Rowing stats saved!');
        }

        function saveLifting() {
            const exName = document.getElementById('exerciseName').value.trim();
            if(!exName) { alert('Please enter an exercise name.'); return; }
            
            // Save newly discovered custom exercises to autocomplete bank
            let savedEx = JSON.parse(localStorage.getItem('customExercises')) || [];
            if(!savedEx.some(e => e.toLowerCase() === exName.toLowerCase())) {
                savedEx.push(exName);
                localStorage.setItem('customExercises', JSON.stringify(savedEx));
                loadCustomExercises();
            }

            const data = {
                id: Date.now(), type: 'Lifting', date: getSelectedDate(),
                muscle: document.getElementById('muscleGroup').value,
                exercise: exName,
                weight: document.getElementById('liftWeight').value || 0,
                reps: document.getElementById('liftReps').value || 0
            };
            let log = JSON.parse(localStorage.getItem('gymMasterHistory')) || [];
            log.unshift(data);
            localStorage.setItem('gymMasterHistory', JSON.stringify(log));
            displayHistory();
            
            document.getElementById('exerciseName').value = '';
            document.getElementById('liftWeight').value = '';
            document.getElementById('liftReps').value = '';
            alert('Lifting set saved!');
        }

        function deleteEntry(id) {
            if (confirm("Delete this log entry?")) {
                let log = JSON.parse(localStorage.getItem('gymMasterHistory')) || [];
                log = log.filter(item => item.id !== id);
                localStorage.setItem('gymMasterHistory', JSON.stringify(log));
                displayHistory();
            }
        }

        function displayHistory() {
            let log = JSON.parse(localStorage.getItem('gymMasterHistory')) || [];
            const container = document.getElementById('history');
            if (log.length === 0) { container.innerHTML = "No history saved yet."; return; }
            
            container.innerHTML = log.map(h => {
                if(h.type === 'Rowing') {
                    return `
                        <div class="log-entry" style="border-left-color: #0a84ff;">
                            <button class="delete-btn" onclick="deleteEntry(${h.id})">✕</button>
                            <span><b>${h.date}</b> — Rowing Session</span>
                            Kcal: <b>${h.kcal}</b> | Res: <b>${h.res}</b><br>
                            Watts: ${h.wAvg}a / ${h.wMax}m | SPM: ${h.spmAvg}a / ${h.spmMax}m<br>
                            500m: ${h.mAvg}a / ${h.mMax}m | Drive: ${h.dlAvg}a / ${h.dlMax}m
                        </div>`;
                } else {
                    return `
                        <div class="log-entry" style="border-left-color: #30d158;">
                            <button class="delete-btn" onclick="deleteEntry(${h.id})">✕</button>
                            <span><b>${h.date}</b> — ${h.muscle} Strength</span>
                            <b>${h.exercise}</b>: ${h.weight} lbs x ${h.reps} reps
                        </div>`;
                }
            }).join('');
        }

        function exportToCSV() {
            let log = JSON.parse(localStorage.getItem('gymMasterHistory')) || [];
            if (log.length === 0) { alert("No logs to export."); return; }
            let csv = "data:text/csv;charset=utf-8,Date,Type,Details\n";
            log.forEach(h => {
                if(h.type === 'Rowing') {
                    csv += `"${h.date}","Rowing","Kcal: ${h.kcal} | Res: ${h.res} | Watts Avg: ${h.wAvg} Max: ${h.wMax} | SPM Avg: ${h.spmAvg} Max: ${h.spmMax} | 500m Avg: ${h.mAvg} Max: ${h.mMax}"\n`;
                } else {
                    csv += `"${h.date}","Lifting","[${h.muscle}] ${h.exercise}: ${h.weight}lbs x ${h.reps}reps"\n`;
                }
            });
            const encodedUri = encodeURI(csv);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", "gym_master_history.csv");
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        window.onload = function() {
            displayHistory();
            loadCustomExercises();
        };
    </script>
</body>
</html>
