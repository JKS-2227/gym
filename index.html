<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Gym Log</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #ffffff;
            --text-secondary: #aaaaaa;
            --accent-color: #0a84ff;
            --border-color: #333333;
            --input-bg: #2c2c2e;
            --danger-color: #ff453a;
            --success-color: #30d158;
        }
        @media (prefers-color-scheme: light) {
            :root {
                --bg-color: #f2f2f7;
                --card-bg: #ffffff;
                --text-color: #000000;
                --text-secondary: #666666;
                --accent-color: #007aff;
                --border-color: #e5e5ea;
                --input-bg: #e9e9eb;
                --danger-color: #ff3b30;
                --success-color: #34c759;
            }
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            padding-top: calc(20px + env(safe-area-inset-top));
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 450px;
        }
        h1 {
            font-size: 24px;
            margin-bottom: 20px;
            font-weight: 700;
        }
        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
            box-shadow: 0 4px 6px rgba(0,0,0,.05);
            border: 1px solid var(--border-color);
        }
        h2 {
            font-size: 18px;
            margin-top: 0;
            margin-bottom: 14px;
            color: var(--accent-color);
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 6px;
        }
        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 12px;
        }
        .form-group {
            display: flex;
            flex-direction: column;
        }
        label {
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            color: var(--text-secondary);
            margin-bottom: 4px;
        }
        input {
            background-color: var(--input-bg);
            border: none;
            border-radius: 8px;
            padding: 10px;
            color: var(--text-color);
            font-size: 16px;
            -webkit-appearance: none;
        }
        input:focus {
            outline: 2px solid var(--accent-color);
        }
        .btn-primary {
            background-color: var(--accent-color);
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 14px;
            font-size: 16px;
            font-weight: 600;
            width: 100%;
            margin-top: 10px;
            cursor: pointer;
            -webkit-appearance: none;
        }
        .btn-secondary {
            background-color: transparent;
            color: var(--text-secondary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 10px;
            font-size: 14px;
            width: 100%;
            margin-top: 8px;
            cursor: pointer;
        }
        button:active {
            opacity: .8;
        }
        .log-entry {
            border-left: 3px solid var(--accent-color);
            padding-left: 10px;
            margin-bottom: 16px;
            font-size: 14px;
            position: relative;
        }
        .log-entry span {
            color: var(--text-secondary);
            display: block;
            font-size: 11px;
        }
        .delete-btn {
            position: absolute;
            right: 0;
            top: 0;
            background: none;
            border: none;
            color: var(--danger-color);
            font-size: 12px;
            cursor: pointer;
            padding: 4px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Gym Logger</h1>
        <div class="card">
            <h2>Rowing Tracker</h2>
            <div class="grid-2">
                <div class="form-group">
                    <label>Kcal</label>
                    <input type="number" inputmode="numeric" id="kcal" placeholder="0">
                </div>
                <div class="form-group">
                    <label>Resistance</label>
                    <input type="number" inputmode="numeric" id="res" value="10">
                </div>
            </div>
            <div class="grid-2">
                <div class="form-group">
                    <label>Watts (Avg)</label>
                    <input type="number" inputmode="numeric" id="wAvg" placeholder="0" oninput="calculateSplit('wAvg', 'mAvg')">
                </div>
                <div class="form-group">
                    <label>Watts (Max)</label>
                    <input type="number" inputmode="numeric" id="wMax" placeholder="0" oninput="calculateSplit('wMax', 'mMax')">
                </div>
            </div>
            <div class="grid-2">
                <div class="form-group">
                    <label>SPM (Avg)</label>
                    <input type="number" inputmode="numeric" id="spmAvg" placeholder="0">
                </div>
                <div class="form-group">
                    <label>SPM (Max)</label>
                    <input type="number" inputmode="numeric" id="spmMax" placeholder="0">
                </div>
            </div>
            <div class="grid-2">
                <div class="form-group">
                    <label>500m (Avg)</label>
                    <input type="text" id="mAvg" placeholder="0:00.0">
                </div>
                <div class="form-group">
                    <label>500m (Max)</label>
                    <input type="text" id="mMax" placeholder="0:00.0">
                </div>
            </div>
            <div class="grid-2">
                <div class="form-group">
                    <label>Drive Length (Avg)</label>
                    <input type="number" inputmode="decimal" step="0.01" id="dlAvg" placeholder="0.00">
                </div>
                <div class="form-group">
                    <label>Drive Length (Max)</label>
                    <input type="number" inputmode="decimal" step="0.01" id="dlMax" placeholder="0.00">
                </div>
            </div>
        </div>
        
        <button type="button" class="btn-primary" onclick="saveWorkout()">Save Workout</button>
        <button type="button" class="btn-secondary" onclick="clearForm()">Clear Current Form</button>
        
        <div class="card" style="margin-top:20px;">
            <h2>History Log</h2>
            <div id="history">No workouts saved yet.</div>
            <button type="button" class="btn-secondary" style="margin-top: 15px;" onclick="exportToCSV()">Export Data to CSV Backup</button>
        </div>
    </div>

    <script>
        function calculateSplit(wattsId, splitId) {
            const watts = parseFloat(document.getElementById(wattsId).value);
            const splitInput = document.getElementById(splitId);
            
            if (!watts || watts <= 0) {
                splitInput.value = '';
                return;
            }
            
            const totalSeconds = Math.pow(2.80 / watts, 1/3) * 500;
            const minutes = Math.floor(totalSeconds / 60);
            const seconds = (totalSeconds % 60).toFixed(1);
            
            splitInput.value = `${minutes}:${seconds.padStart(4, '0')}`;
        }

        function saveWorkout() {
            const data = {
                id: Date.now(),
                date: new Date().toLocaleDateString(),
                time: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}),
                kcal: document.getElementById('kcal').value || 0,
                res: document.getElementById('res').value || 10,
                wAvg: document.getElementById('wAvg').value || 0,
                wMax: document.getElementById('wMax').value || 0,
                spmAvg: document.getElementById('spmAvg').value || 0,
                spmMax: document.getElementById('spmMax').value || 0,
                mAvg: document.getElementById('mAvg').value || '0:00.0',
                mMax: document.getElementById('mMax').value || '0:00.0',
                dlAvg: document.getElementById('dlAvg').value || '0.00',
                dlMax: document.getElementById('dlMax').value || '0.00'
            };
            let history = JSON.parse(localStorage.getItem('rowingHistory')) || [];
            history.unshift(data);
            localStorage.setItem('rowingHistory', JSON.stringify(history));
            displayHistory();
            clearForm();
            alert('Workout saved strictly on your iPhone!');
        }

        function clearForm() {
            const currentRes = document.getElementById('res').value;
            document.getElementById('kcal').value = '';
            document.getElementById('wAvg').value = '';
            document.getElementById('wMax').value = '';
            document.getElementById('spmAvg').value = '';
            document.getElementById('spmMax').value = '';
            document.getElementById('mAvg').value = '';
            document.getElementById('mMax').value = '';
            document.getElementById('dlAvg').value = '';
document.getElementById('dlMax').value = '';
document.getElementById('res').value = currentRes || 10;
}
function deleteEntry(id) {
if (confirm("Are you sure you want to delete this workout log?")) {
let history = JSON.parse(localStorage.getItem('rowingHistory')) || [];
history = history.filter(item => item.id !== id);
localStorage.setItem('rowingHistory', JSON.stringify(history));
displayHistory();
}
}
function displayHistory() {
let history = JSON.parse(localStorage.getItem('rowingHistory')) || [];
const container = document.getElementById('history');
if (history.length === 0) {
container.innerHTML = "No workouts saved yet.";
return;
}
container.innerHTML = history.map(h => <div class="log-entry"> <button class="delete-btn" onclick="deleteEntry(${h.id})">✕ Delete</button> <span>${h.date} @ ${h.time}</span> Kcal: <b>${h.kcal}</b> | Res: <b>${h.res}</b><br> Watts: ${h.wAvg}a / ${h.wMax}m | SPM: ${h.spmAvg}a / ${h.spmMax}m<br> 500m: ${h.mAvg}a / ${h.mMax}m | Drive: ${h.dlAvg}a / ${h.dlMax}m </div>).join('');
}
function exportToCSV() {
let history = JSON.parse(localStorage.getItem('rowingHistory')) || [];
if (history.length === 0) {
alert("No logs available to export.");
return;
}
let csvContent = "data:text/csv;charset=utf-8,Date,Time,Kcal,Resistance,Watts Avg,Watts Max,SPM Avg,SPM Max,500m Avg,500m Max,Drive Length Avg,Drive Length Max\n";
history.forEach(h => {
csvContent += "${h.date}","${h.time}",${h.kcal},${h.res},${h.wAvg},${h.wMax},${h.spmAvg},${h.spmMax},"${h.mAvg}","${h.mMax}",${h.dlAvg},${h.dlMax}\n;
});
const encodedUri = encodeURI(csvContent);
const link = document.createElement("a");
link.setAttribute("href", encodedUri);
link.setAttribute("download", "my_gym_rowing_history.csv");
document.body.appendChild(link);
link.click();
document.body.removeChild(link);
}
window.onload = displayHistory;
